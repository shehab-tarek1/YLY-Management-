<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta property="og:title" content="YLY Management | Pro System">
    <meta property="og:description" content="نظام إدارة اللجان والأعضاء لمبادرة شباب يدير شباب YLY">
    <meta property="og:image" content="https://res.cloudinary.com/dsxrjmcxs/image/upload/c_limit,w_400,q_auto,f_auto/v1784657868/etyefoyw9madba5a5u1z.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://res.cloudinary.com/dsxrjmcxs/image/upload/c_limit,w_400,q_auto,f_auto/v1784657868/etyefoyw9madba5a5u1z.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#1e3a8a">
    
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="https://res.cloudinary.com/dsxrjmcxs/image/upload/c_limit,w_400,q_auto,f_auto/v1784657850/s60xlqx1otmwcijtjw1l.png">
    
    <title>YLY Management | Pro System</title>
    
    <!-- Tailwind CSS -->
    <link rel="stylesheet" href="tailwind.min.css">

    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">

    <!-- سيتم إدراج CSS هنا في المرحلة الثانية -->
    <link rel="stylesheet" href="styles.css">
</head>
<body class="text-gray-800" onclick="if(window.closeAllDropdowns) window.closeAllDropdowns(event)">

    <!-- Loading Overlay -->
    <div id="loadingOverlay">
        <div class="spinner-box">
            <div class="modern-spinner"></div>
            <img src="https://res.cloudinary.com/dsxrjmcxs/image/upload/c_limit,w_400,q_auto,f_auto/v1784657850/s60xlqx1otmwcijtjw1l.png" class="w-14 h-14 object-contain z-10 drop-shadow-xl" alt="YLY Logo">
        </div>
        <div class="text-2xl font-black tracking-wider text-white mb-2">
            YLY <span class="text-red-500">System</span>
        </div>
        <div class="text-[10px] text-gray-400 font-mono text-center leading-relaxed">جاري تأمين النظام وتهيئته...</div>
    </div>

    <!-- Login Overlay -->
    <div id="loginOverlay">
        <div class="login-card">
            <div class="mb-3">
                <img src="https://res.cloudinary.com/dsxrjmcxs/image/upload/c_limit,w_400,q_auto,f_auto/v1784657850/s60xlqx1otmwcijtjw1l.png" class="w-16 h-16 object-contain mx-auto mb-1 drop-shadow-md" alt="YLY Logo">
                <h1 class="text-2xl font-black text-gray-900 mb-0">YLY System</h1>
                <p class="text-gray-500 text-[10px] font-bold">نظام متابعة الحضور والغياب</p>
            </div>
            <div id="loginForm">
                <div class="input-wrapper mb-2"><input type="text" id="loginCode" class="login-input" placeholder="كود العضو"></div>
                <div class="input-wrapper mb-3"><input type="password" id="loginPass" class="login-input" placeholder="كلمة المرور"></div>
                <button onclick="handleLogin()" class="login-btn shadow-lg">تسجيل الدخول</button>
            </div>
            <p id="loginError" class="text-red-500 text-[10px] mt-2 hidden font-bold bg-red-50 p-2 rounded">الكود أو كلمة المرور غير صحيحة</p>
        </div>
    </div>

    <div id="customAlertModal">
        <div class="alert-card">
            <div id="alertIcon" class="alert-icon">⚠️</div>
            <h3 id="alertTitle" class="text-base font-bold text-gray-800 mb-1">تنبيه</h3>
            <p id="alertMessage" class="text-[11px] text-gray-600 font-bold mb-4"></p>
            <button onclick="closeCustomAlert()" class="alert-btn shadow-lg">حسناً</button>
        </div>
    </div>

    <div id="print-container"></div>

    <div id="appContent" class="hidden">
        <header id="mainHeader" class="bg-blue-900 text-white shadow-md sticky top-0 z-50 no-print">
            <div class="container mx-auto px-4 py-2 flex justify-between items-center">
                <h1 class="text-sm font-bold flex items-center gap-2 md:text-xl">
                    <img src="https://res.cloudinary.com/dsxrjmcxs/image/upload/c_limit,w_400,q_auto,f_auto/v1784657850/s60xlqx1otmwcijtjw1l.png" class="w-7 h-7 object-cover drop-shadow-md" alt="YLY Logo">
                    YLY System <span id="hdrUser" class="text-[9px] bg-blue-800 px-2 py-0.5 rounded-full md:text-xs"></span>
                </h1>
                <div class="flex items-center gap-2">
                    <div class="text-[9px] bg-blue-800 px-2 py-1 rounded-full font-mono border border-blue-700 md:text-xs" id="headerDate">--/--/----</div>
                    <button onclick="logout()" class="text-[9px] bg-red-600 px-2 py-1 rounded font-bold hover:bg-red-700 transition md:text-xs md:px-3 border border-red-800">خروج</button>
                </div>
            </div>
            <div class="bg-blue-950 border-t border-blue-800 hidden" id="navBar">
                <div class="container mx-auto px-2">
                    <div class="flex w-full gap-1.5 py-1.5 md:gap-4 md:py-2">
                        <button id="nav-home" onclick="showTab('home', this)" class="nav-item flex-1 py-1.5 rounded text-[11px] text-blue-100 flex-shrink-0 text-center transition-all md:text-sm">القائمة</button>
                        <button id="nav-reports" onclick="showTab('reports', this)" class="nav-item flex-1 py-1.5 rounded text-[11px] text-blue-100 flex-shrink-0 text-center transition-all md:text-sm">التقارير</button>
                    </div>
                </div>
            </div>
        </header>

        <main id="mainContent" class="container mx-auto p-3 max-w-4xl md:max-w-6xl">

            <!-- لوحة العضو: حضوره وغيابه فقط -->
            <section id="memberDashboard" class="tab-content">
                <div class="flex justify-end mb-2 no-print gap-2">
                    <button onclick="printMemberFile()" class="bg-blue-900 text-white px-3 py-1 rounded text-xs font-bold md:text-sm md:px-4 md:py-2">🖨️ طباعة</button>
                    <button onclick="pdfMemberFile()" class="bg-red-700 text-white px-3 py-1 rounded text-xs font-bold md:text-sm md:px-4 md:py-2">📄 PDF</button>
                </div>
                <div id="memberDashBody"></div>
            </section>

            <!-- الرئيسية: قائمة الأعضاء المتابَعين -->
            <section id="home" class="tab-content">
                <div class="glass-card border-r-4 border-blue-700 mb-4 no-print">
                    <h2 class="font-bold text-gray-900 mb-2 text-xs md:text-base">تصفية الحضور</h2>
                    <div id="homeFilters"></div>
                </div>
                <div class="glass-card">
                    <h2 class="font-bold text-[10px] md:text-sm text-gray-800 mb-1">الأعضاء الذين تتابعهم (<span id="followCount">0</span>)</h2>
                    <div id="homeActInfo" class="hidden bg-blue-50 border border-blue-200 text-blue-900 p-2 rounded mb-2 text-xs"></div>
                    <div class="overflow-x-auto">
                        <table class="custom-table">
                            <thead id="homeHead"></thead>
                            <tbody id="homeBody"></tbody>
                        </table>
                    </div>
                </div>
            </section>

            <!-- التقارير -->
            <section id="reports" class="tab-content">
                <div class="glass-card border-t-4 border-gray-600 mb-4">
                    <h3 class="font-bold mb-2 text-gray-900 text-xs md:text-base">👤 ملف عضو</h3>
                    <div class="flex gap-1 mb-1 relative">
                        <div class="input-wrapper flex-1">
                            <input type="text" id="reportMemberSearch" onkeyup="handleMemberSearch()" placeholder="ابحث بالاسم أو الكود" class="w-full p-1 text-xs md:text-sm md:p-2">
                        </div>
                        <button onclick="searchMember()" class="bg-gray-800 text-white px-3 rounded font-bold text-[10px] md:text-sm shrink-0">بحث</button>
                        <button id="btnQrScan" onclick="startReportScanner()" class="bg-gray-800 text-white px-3 rounded font-bold text-[10px] md:text-sm shrink-0">📷</button>
                    </div>
                    <div id="reportSearchResults" class="hidden bg-white border border-blue-200 rounded-lg shadow max-h-60 overflow-y-auto"></div>
                    <div id="reportReaderWrap" class="hidden mt-2"><div id="reportReader" class="scanner-wrapper w-full"></div></div>
                </div>

                <div class="glass-card border-t-4 border-blue-800 mb-4">
                    <h3 class="font-bold mb-2 text-blue-900 text-xs md:text-base">📊 تقرير الأعضاء المتابَعين</h3>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-2 mb-2">
                        <div><label class="text-[9px] text-gray-500 block mb-0.5 md:text-xs">النوع</label><div id="repTypeBox"></div></div>
                        <div><label class="text-[9px] text-gray-500 block mb-0.5 md:text-xs">من</label><input type="date" id="repFrom" class="w-full p-1 text-xs md:text-sm md:p-2 border rounded"></div>
                        <div><label class="text-[9px] text-gray-500 block mb-0.5 md:text-xs">إلى</label><input type="date" id="repTo" class="w-full p-1 text-xs md:text-sm md:p-2 border rounded"></div>
                    </div>
                    <button onclick="generateReport()" class="w-full bg-blue-900 text-white py-2 rounded font-bold text-xs md:text-sm">عرض التقرير</button>
                    <div id="reportResult" class="mt-3 hidden">
                        <div class="flex justify-between items-center mb-2 flex-wrap gap-2">
                            <h4 id="reportResultTitle" class="font-bold text-xs text-gray-800"></h4>
                            <div class="flex gap-1">
                                <button onclick="printReport()" class="bg-gray-800 text-white px-2 py-1 rounded text-[10px] font-bold">🖨️ طباعة</button>
                                <button onclick="pdfReport()" class="bg-red-700 text-white px-2 py-1 rounded text-[10px] font-bold">📄 PDF</button>
                                <button onclick="excelReport()" class="bg-green-700 text-white px-2 py-1 rounded text-[10px] font-bold">📊 Excel</button>
                            </div>
                        </div>
                        <div class="overflow-x-auto"><table class="custom-table" id="reportTable"></table></div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- صفحة داخلية: ملف العضو -->
    <div id="internalMemberPage" class="internal-page">
        <div class="internal-header no-print flex items-center gap-2">
            <button class="circle-back-btn shrink-0" onclick="closeInternalPage('internalMemberPage')">➔</button>
            <h2 id="memberFileTitle" class="font-bold text-xs flex-1 truncate"></h2>
            <div class="flex gap-1 shrink-0">
                <button onclick="printMemberFile()" class="bg-gray-800 text-white px-2 py-1 rounded font-bold text-[9px] shadow">🖨️ طباعة</button>
                <button onclick="pdfMemberFile()" class="bg-red-700 text-white px-2 py-1 rounded font-bold text-[9px] shadow">📄 PDF</button>
            </div>
        </div>
        <div class="p-3 max-w-4xl mx-auto w-full" id="memberFileBody"></div>
    </div>

    <!-- PWA Install Banner -->
    <div id="pwaInstallBanner" class="fixed bottom-4 left-4 z-[999999] translate-y-24 opacity-0 transition-all duration-500 ease-out hidden w-auto max-w-[280px]">
        <div class="bg-blue-900/95 backdrop-blur-md border border-blue-700 rounded-2xl p-3 shadow-2xl flex items-center justify-between gap-3">
            <div class="flex items-center gap-2">
                <div class="bg-blue-800 p-1.5 rounded-xl border border-blue-600"><span class="text-xl">📲</span></div>
                <div>
                    <h4 class="text-white font-bold text-xs">تثبيت التطبيق</h4>
                    <p class="text-blue-200 text-[9px]">YLY System</p>
                </div>
            </div>
            <button id="pwaInstallBtn" class="bg-red-600 text-white px-3 py-1.5 rounded-lg font-bold text-[10px] shadow-lg hover:bg-red-500 transition transform active:scale-95 whitespace-nowrap">تثبيت</button>
            <button onclick="dismissInstallBanner()" class="absolute -top-2 -left-2 bg-gray-500 text-white rounded-full w-4 h-4 flex items-center justify-center text-[10px] shadow-md">&times;</button>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed top-5 left-1/2 transform -translate-x-1/2 bg-gray-800 text-white px-4 py-2 rounded-full shadow-xl hidden font-bold text-[10px] max-w-[90%] w-auto text-center whitespace-nowrap"></div>

    <!-- سيتم إدراج JavaScript هنا في المرحلة الثالثة -->
    <script type="module" src="app.js"></script>

<!-- كود تشغيل الـ Service Worker وإظهار بنر التثبيت تلقائياً -->
<script>
  let deferredPrompt;
  const pwaBanner = document.getElementById('pwaInstallBanner');
  const installBtn = document.getElementById('pwaInstallBtn');

  // 1. تسجيل الـ Service Worker
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./service-worker.js')
        .then(reg => console.log('Service Worker Registered Successfully!', reg))
        .catch(err => console.error('Service Worker Registration Failed!', err));
    });
  }

  // 2. الاستماع لحدث التثبيت وإظهار البنر
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    if (pwaBanner) {
      pwaBanner.classList.remove('hidden');
      setTimeout(() => {
        pwaBanner.classList.remove('translate-y-24', 'opacity-0');
        pwaBanner.classList.add('translate-y-0', 'opacity-100');
      }, 100);
    }
  });

  // 3. الضغط على زر التثبيت
  if (installBtn) {
    installBtn.addEventListener('click', async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        console.log(`User response to install prompt: ${outcome}`);
        deferredPrompt = null;
        dismissInstallBanner();
      }
    });
  }

  // 4. إغلاق بنر التثبيت
  window.dismissInstallBanner = function() {
    if (!pwaBanner) return;
    pwaBanner.classList.remove('translate-y-0', 'opacity-100');
    pwaBanner.classList.add('translate-y-24', 'opacity-0');
    setTimeout(() => pwaBanner.classList.add('hidden'), 500);
  };
</script>
</body>
</html>
